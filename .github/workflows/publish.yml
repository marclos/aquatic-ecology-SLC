name: Render and Publish Quarto Site

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Install R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::readr
            any::knitr
            any::kableExtra

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install TinyTeX
        run: quarto install tinytex --no-prompt

      - name: Render site (HTML)
        run: quarto render

      - name: Render PDFs
        run: |
          quarto render detailed.qmd --to pdf --pdf-engine=pdflatex
          quarto render highlevel.qmd --to pdf --pdf-engine=pdflatex
          for f in detailed.pdf highlevel.pdf; do
            if [ -f "docs/$f" ]; then
              echo "$f already in docs/"
            elif [ -f "$f" ]; then
              cp "$f" "docs/$f"
              echo "copied $f into docs/"
            else
              echo "WARNING: $f not found in project root or docs/"
              exit 1
            fi
          done

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
